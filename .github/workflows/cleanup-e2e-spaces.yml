name: cleanup-e2e-spaces

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    name: "cleanup-e2e-space"
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --upgrade huggingface_hub

      - name: Delete PR test Spaces if they exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os

          import huggingface_hub

          space_id = f"trackio-tests/test_{os.environ['PR_NUMBER']}"
          try:
              huggingface_hub.delete_repo(
                  space_id,
                  repo_type="space",
                  token=os.environ["HF_TOKEN"],
              )
              print(f"Deleted test Space: {space_id}")
          except huggingface_hub.errors.RepositoryNotFoundError:
              print(f"Test Space does not exist: {space_id}")

          prefix = f"trackio-tests/bump_in_place_{os.environ['PR_NUMBER']}_"
          token = os.environ["HF_TOKEN"]
          for space in huggingface_hub.list_spaces(
              author="trackio-tests", search=prefix.split("/")[1], token=token
          ):
              if space.id.startswith(prefix):
                  huggingface_hub.delete_repo(
                      space.id, repo_type="space", missing_ok=True, token=token
                  )
                  print(f"Deleted bump test Space: {space.id}")
          for bucket in huggingface_hub.list_buckets("trackio-tests", token=token):
              if bucket.id.startswith(prefix):
                  huggingface_hub.delete_bucket(bucket.id, missing_ok=True, token=token)
                  print(f"Deleted bump test bucket: {bucket.id}")
          PY
